name: container

on:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - Dockerfile
      - env/enc/**
      - scripts/sops-entrypoint.sh
      - src/**
      - .github/workflows/container.yml
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - Dockerfile
      - env/enc/**
      - scripts/sops-entrypoint.sh
      - src/**
      - .github/workflows/container.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require private dependency credential
        env:
          FLEET_GITHUB_TOKEN: ${{ secrets.FLEET_GITHUB_READ_TOKEN }}
        run: test -n "$FLEET_GITHUB_TOKEN"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish exact image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          provenance: mode=max
          sbom: true
          build-args: SOURCE_REVISION=${{ github.sha }}
          secrets: github_token=${{ secrets.FLEET_GITHUB_READ_TOKEN }}
          tags: |
            ghcr.io/hacker-house-medellin/hhm-api:${{ github.sha }}
            ghcr.io/hacker-house-medellin/hhm-api:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: test -n "$IMAGE_DIGEST" && printf 'ghcr.io/hacker-house-medellin/hhm-api@%s\n' "$IMAGE_DIGEST"
