name: rust-ci

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +1.94.0 fmt --all -- --check
      - name: Check
        run: cargo +1.94.0 check --locked --all-targets --all-features
      - name: Clippy
        run: cargo +1.94.0 clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo +1.94.0 test --locked --all-targets --all-features
