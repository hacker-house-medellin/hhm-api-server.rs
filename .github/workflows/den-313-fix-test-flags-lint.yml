name: Apply scoped DEN-313 flags test lint repair

on:
  push:
    branches:
      - feat/intake-dual-persistence
    paths:
      - .github/workflows/den-313-fix-test-flags-lint.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Preserve the fallible production signature and scope the test-only lint exception
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/flags.rs')
          text = path.read_text(encoding='utf-8')
          old = '''#[cfg(test)]
/// Bypasses process-level argv handling in isolated unit tests.'''
          new = '''#[cfg(test)]
#[allow(clippy::unnecessary_wraps)]
/// Bypasses process-level argv handling in isolated unit tests.'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one test-only process_control boundary')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          grep -Fq '#[allow(clippy::unnecessary_wraps)]' src/flags.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/flags.rs
          git rm .github/workflows/den-313-fix-test-flags-lint.yml
          git commit -m 'fix(DEN-313): scope test-only flags lint exception'
          git push origin HEAD:feat/intake-dual-persistence
