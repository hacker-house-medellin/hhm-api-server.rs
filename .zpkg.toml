[package]
org = "hacker-house-medellin"
name = "hhm-api-server"
version = "0.1.0"
description = "Rust API server for Hacker House Medellín"
license = "MIT"
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/hacker-house-medellin/hhm-api-server.rs"

[install]
dir = ".vendor/.zed"

[dependencies]
"hacker-house-medellin/hhm-lib-core" = "^0.1.0"
"hacker-house-medellin/hhm-orm-core" = "^0.1.0"
# Cargo.lock and immutable Cargo Git revisions remain authoritative until the
# corresponding Zed artifacts are published.

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "node_modules/**", "target/**", "dist/**", "*.log", ".vendor/.zed/**"]