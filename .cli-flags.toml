[identity]
service = "hhm-api"
type_name = "RuntimeEnv"

[help]
url = "https://github.com/flags-2-env/flags-2-env"
columns = ["options", "env", "type", "default", "description"]

[parse]
allow_unknown = false

[env]
ignore = [
  "DATABASE_URL",
  "SUPABASE_DATABASE_URL",
  "SUPABASE_SERVICE_ROLE_KEY",
  "TURNSTILE_SECRET_KEY",
  "SHARED_AUTH_SERVICE_CREDENTIAL",
  "ORES_MIDDLEWARE_RATE_LIMIT_HMAC_SECRET",
]

[flags.help]
env = "CLI_HELP_REQUESTED"
long = "help"
short = "h"
type = "boolean"
default = false
help = "Print command-line help."

[flags.version]
env = "CLI_VERSION_REQUESTED"
long = "version"
short = "V"
type = "boolean"
default = false
help = "Print the server version."

[flags.host]
env = "HOST"
long = "host"
type = "string"
default = "0.0.0.0"
help = "API listener host."

[flags.port]
env = "PORT"
long = "port"
short = "p"
type = "integer"
default = 8080
help = "API listener port."

[flags.supabase-url]
env = "SUPABASE_URL"
long = "supabase-url"
type = "string"
help = "Credential-free Supabase project URL."

[flags.cors-origins]
env = "CORS_ORIGINS"
long = "cors-origins"
type = "string"
default = ""
help = "Comma-separated exact HTTP(S) CORS origins."

[flags.rust-log]
env = "RUST_LOG"
long = "rust-log"
type = "string"
default = "error"
help = "Tracing filter."

[flags.app-env]
env = "APP_ENV"
long = "app-env"
type = "string"
default = "development"
help = "Runtime policy environment: development, test, staging, or production."

[flags.middleware-tls-mode]
env = "ORES_MIDDLEWARE_TLS_MODE"
long = "middleware-tls-mode"
type = "string"
default = "disabled"
help = "Request transport policy: disabled, in-process, or trusted-proxy."

[flags.middleware-trusted-proxy-cidrs]
env = "ORES_MIDDLEWARE_TRUSTED_PROXY_CIDRS"
long = "middleware-trusted-proxy-cidrs"
type = "string"
default = ""
help = "Comma-separated immediate-peer CIDRs trusted to supply forwarded headers."

[flags.middleware-timeout-ms]
env = "ORES_MIDDLEWARE_TIMEOUT_MS"
long = "middleware-timeout-ms"
type = "integer"
default = 10000
help = "Maximum HTTP request lifecycle in milliseconds."

[flags.middleware-max-body-bytes]
env = "ORES_MIDDLEWARE_MAX_BODY_BYTES"
long = "middleware-max-body-bytes"
type = "integer"
default = 262144
help = "Maximum request body size in bytes."

[flags.middleware-rate-limit-capacity]
env = "ORES_MIDDLEWARE_RATE_LIMIT_CAPACITY"
long = "middleware-rate-limit-capacity"
type = "integer"
default = 60
help = "Per-peer and route token-bucket capacity."

[flags.middleware-rate-limit-refill]
env = "ORES_MIDDLEWARE_RATE_LIMIT_REFILL_PER_SECOND"
long = "middleware-rate-limit-refill"
type = "number"
default = 1
help = "Per-peer and route token refill rate per second."
