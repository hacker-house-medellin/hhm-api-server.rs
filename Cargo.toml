[package]
name = "hhm-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros", "ws"] }
chrono = { version = "0.4", features = ["serde"] }
flags2env = { version = "0.1.0", git = "https://github.com/flags-2-env/flags-2-env", rev = "d7bad9ea7dfc657653368237e08903514cdca1ec" }
futures-util = "0.3"
hhm-interfaces = { git = "https://github.com/hacker-house-medellin/hhm-interfaces", rev = "b66988b856946ff028085323ff502796b97e0012" }
hhm-intake-schema = { git = "https://github.com/hacker-house-medellin/hhm-lib-core", rev = "bf9b319b71595e76c2519b0cbce4aa1a4953217a" }
ores-middleware = { git = "https://github.com/ORESoftware/ores-middleware", rev = "6183cc877d6c058349adc733d325297c07d1c063" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
secrecy = "0.10"
sea-orm = { version = "=2.0.2", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "with-chrono", "with-uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
toml = "0.8"
tower-http = { version = "=0.7.1", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "warn"
