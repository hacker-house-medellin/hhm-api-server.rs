[package]
name = "hhm-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
dotenvy = "0.15"
futures-util = "0.3"
hhm-interfaces = { git = "https://github.com/hacker-house-medellin/hhm-interfaces", rev = "415e94c79fe276cc9d737fc2c458190ff6fea97f" }
hhm-orm-core = { git = "https://github.com/hacker-house-medellin/hhm-orm-core", rev = "dd862f6df811fe6ca8c8452f9937eec3f10a24b0", features = ["read-write"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shared-auth-service-client = { git = "https://github.com/shared-auth/shared-auth-clients.git", rev = "2173ea959f489e40b03deb776e51025c1957a9a8", package = "shared-auth-service-client" }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "warn"
